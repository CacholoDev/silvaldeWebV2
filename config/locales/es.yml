es:
  errors:
    format: "%{message}"
    # Generic validation messages (Rails only ships them in English). The
    # format above shows just the message, so each one names the attribute.
    # Model-specific messages under activerecord.errors.models take priority.
    messages:
      accepted: "%{attribute} debe ser aceptado."
      blank: "%{attribute} no puede estar vacío."
      confirmation: "%{attribute} no coincide."
      empty: "%{attribute} no puede estar vacío."
      equal_to: "%{attribute} debe ser igual a %{count}."
      even: "%{attribute} debe ser un número par."
      exclusion: "%{attribute} no está disponible."
      greater_than: "%{attribute} debe ser mayor que %{count}."
      greater_than_or_equal_to: "%{attribute} debe ser mayor o igual que %{count}."
      in: "%{attribute} debe estar en %{count}."
      inclusion: "%{attribute} no está en la lista."
      invalid: "%{attribute} no es válido."
      less_than: "%{attribute} debe ser menor que %{count}."
      less_than_or_equal_to: "%{attribute} debe ser menor o igual que %{count}."
      model_invalid: "La validación ha fallado: %{errors}"
      not_a_number: "%{attribute} no es un número."
      not_an_integer: "%{attribute} debe ser un número entero."
      odd: "%{attribute} debe ser un número impar."
      other_than: "%{attribute} debe ser distinto de %{count}."
      password_too_long: "%{attribute} es demasiado larga."
      present: "%{attribute} debe estar vacío."
      required: "%{attribute} tiene que existir."
      taken: "%{attribute} ya está en uso."
      too_long:
        one: "%{attribute} es demasiado largo (máximo 1 carácter)."
        other: "%{attribute} es demasiado largo (máximo %{count} caracteres)."
      too_short:
        one: "%{attribute} es demasiado corto (mínimo 1 carácter)."
        other: "%{attribute} es demasiado corto (mínimo %{count} caracteres)."
      wrong_length:
        one: "%{attribute} no tiene la longitud correcta (1 carácter exactos)."
        other: "%{attribute} no tiene la longitud correcta (%{count} caracteres exactos)."
