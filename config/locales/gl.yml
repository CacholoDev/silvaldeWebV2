gl:
  errors:
    format: "%{message}"
    # Generic validation messages (Rails only ships them in English). The
    # format above shows just the message, so each one names the attribute.
    # Model-specific messages under activerecord.errors.models take priority.
    messages:
      accepted: "%{attribute} debe ser aceptado."
      blank: "%{attribute} non pode estar baleiro."
      confirmation: "%{attribute} non coincide."
      empty: "%{attribute} non pode estar baleiro."
      equal_to: "%{attribute} debe ser igual a %{count}."
      even: "%{attribute} debe ser un número par."
      exclusion: "%{attribute} non está dispoñible."
      greater_than: "%{attribute} debe ser maior que %{count}."
      greater_than_or_equal_to: "%{attribute} debe ser maior ou igual que %{count}."
      in: "%{attribute} debe estar en %{count}."
      inclusion: "%{attribute} non está na lista."
      invalid: "%{attribute} non é válido."
      less_than: "%{attribute} debe ser menor que %{count}."
      less_than_or_equal_to: "%{attribute} debe ser menor ou igual que %{count}."
      model_invalid: "A validación fallou: %{errors}"
      not_a_number: "%{attribute} non é un número."
      not_an_integer: "%{attribute} debe ser un número enteiro."
      odd: "%{attribute} debe ser un número impar."
      other_than: "%{attribute} debe ser distinto de %{count}."
      password_too_long: "%{attribute} é demasiado longo."
      present: "%{attribute} debe estar baleiro."
      required: "%{attribute} ten que existir."
      taken: "%{attribute} xa está en uso."
      too_long:
        one: "%{attribute} é demasiado longo (máximo 1 carácter)."
        other: "%{attribute} é demasiado longo (máximo %{count} caracteres)."
      too_short:
        one: "%{attribute} é demasiado curto (mínimo 1 carácter)."
        other: "%{attribute} é demasiado curto (mínimo %{count} caracteres)."
      wrong_length:
        one: "%{attribute} non ten a lonxitude correcta (1 carácter exacto)."
        other: "%{attribute} non ten a lonxitude correcta (%{count} caracteres exactos)."
